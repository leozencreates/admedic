[workspace]

[package]
name = "admedic-desktop"
version = "0.1.0"
description = "Masaüstü ve iOS kabuğu (Tauri v2) — sunucudaki web panelini saran ince istemci (ADR-0025)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UI statik dosyaları göm
[lib]
name = "admedic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
