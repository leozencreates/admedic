<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Başlık ve h1 çalışma zamanında /v1/overview yanıtındaki appName (APP_NAME) ile doldurulur; sabit ad yazılmaz. -->
  <title>Panel</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>Panel</h1>
    <span class="muted" id="ws"></span>
    <span id="status" class="muted"></span>

      <label for="token-input">API belirteci</label>
      <input id="token-input" type="password" placeholder="API_TOKEN" />
      <button type="submit">Bağlan</button>

  <main>
    <div id="meta" class="muted"></div>
    <div id="cards" class="cards"></div>
    <table id="table"></table>
    <div id="alerts"></div>
  </main>
  <script type="module" src="./index.js"></script>
